<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Leitor Óptico</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #f5f5f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    h1 { font-size: 1.15rem; margin-bottom: 10px; text-align: center; color: #fff; }
    #status {
      width: 100%; max-width: 520px; padding: 10px 14px; border-radius: 10px;
      background: #1e1e1e; border: 1px solid #333; text-align: center;
      font-size: 0.92rem; font-weight: 600; color: #ffd54f; margin-bottom: 10px;
    }
    #status.ok { border-color: #00e676; color: #00e676; background: #0d2618; }
    #status.erro { border-color: #ff5252; color: #ff5252; background: #2a1212; }
    .viewport {
      position: relative; width: 100%; max-width: 520px; border-radius: 14px;
      overflow: hidden; background: #000; border: 2px solid #2c2c2c;
    }
    video { display: none; }
    canvas { width: 100%; height: auto; display: block; }
    #resultado {
      width: 100%; max-width: 520px; margin-top: 12px; padding: 14px;
      border-radius: 12px; background: #1c1c1c; border: 1px solid #333; display: none;
    }
    .nota-box { font-size: 1.5rem; font-weight: 800; color: #00e676; margin-bottom: 2px; }
    .sub-nota { font-size: 0.9rem; color: #bdbdbd; margin-bottom: 4px; }
    .fonte { font-size: 0.78rem; color: #8bc34a; margin-bottom: 10px; }
    .fonte.aviso { color: #ffb300; }
    .item-q .pts { display: block; margin-top: 3px; font-weight: 700; }
    .correta .pts { color: #00e676; }
    .errada .pts { color: #ff5252; }
    .detalhes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.9rem; }
    .item-q { background: #262626; padding: 8px 10px; border-radius: 8px; }
    .correta { border-left: 4px solid #00e676; }
    .errada { border-left: 4px solid #ff5252; }
    button {
      margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #2979ff; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="titulo">Leitor Óptico</h1>
  <div id="status">Iniciando câmera...</div>

  <div class="viewport">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="resultado">
    <div class="nota-box" id="notaTexto"></div>
    <div class="sub-nota" id="subNota"></div>
    <div class="fonte" id="fonteProva"></div>
    <div class="detalhes" id="detalhesQuestoes"></div>
    <button onclick="reiniciarLeitura()">Ler Próximo Cartão</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const tituloEl = document.getElementById('titulo');
    const resultadoEl = document.getElementById('resultado');

    // ---------- Prova (gabarito + pontuação) ----------
    // Valores de FALLBACK, usados se o QR Code não puder ser lido.
    // Copiados do bloco [METADADOS PARA GERACAO DO LEITOR OPTICO] do LaTeX.
    const PROVA_PADRAO = {
      id: 'CALC1-P2-EC-T1-V2',
      gab: { 1: 'A', 4: 'B', 5: 'D' },
      pts: { 1: 1.5, 4: 2.0, 5: 1.0 }
    };

    // Geometria do cartão (cm), extraída do TikZ.
    // Âncoras (centros): SE(-0.15, y0) SD(12.65, y0) IE(-0.15, -0.35) ID(12.65, -0.35)
    // Cada questão extra acrescenta 1.2 cm de altura (3 questões: y0 = 6.75; 4 questões: y0 = 7.95).
    const CARTAO = { W: 12.8, H: 7.1, x0: -0.15, y0: 6.75 };
    const CFG = {
      questoesY: [3.7, 2.5, 1.3],
      opcoesX:   [4.8, 6.3, 7.8, 9.3, 10.8],
      letras:    ['A', 'B', 'C', 'D', 'E'],
      raioBolha: 0.26,   // cm
      escala: 60,        // px por cm na imagem retificada
      limiarPreench: 0.5,
      estaveis: 3        // leituras iguais seguidas antes de pontuar
    };

    // Prova ativa (preenchida pelo QR Code ou pelo fallback)
    let PROVA = null;

    function configurarGeometria(n) {
      CARTAO.y0 = 6.75 + 1.2 * (n - 3);
      CARTAO.H = CARTAO.y0 + 0.35;
      CFG.questoesY = Array.from({ length: n }, (_, i) => +(1.3 + 1.2 * (n - 1 - i)).toFixed(2));
    }

    function somaPts(pts, questoes) {
      return Math.round(questoes.reduce((a, q) => a + (pts[q] || 0), 0) * 100) / 100;
    }

    function formatarPts(v) {
      return (Math.round(v * 100) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
    }

    // Interpreta: ID-PROVA:XXX;GAB:Q1A-Q4B-Q5D;PTS:Q1=1.5-Q4=2.0-Q5=1.0
    function interpretarQR(texto) {
      const campos = {};
      texto.split(';').forEach(parte => {
        const i = parte.indexOf(':');
        if (i > 0) campos[parte.slice(0, i).trim().toUpperCase()] = parte.slice(i + 1).trim();
      });
      const gab = {};
      const reGab = /Q(\d+)\s*([A-E])/gi;
      let m;
      while ((m = reGab.exec(campos['GAB'] || '')) !== null) gab[parseInt(m[1], 10)] = m[2].toUpperCase();
      const questoes = Object.keys(gab).map(Number).sort((a, b) => a - b);
      if (!questoes.length) return null;   // QR sem gabarito: nao serve

      const ptsQR = {};
      const rePts = /Q(\d+)\s*=\s*([\d]+(?:[.,]\d+)?)/gi;
      while ((m = rePts.exec(campos['PTS'] || '')) !== null) ptsQR[parseInt(m[1], 10)] = parseFloat(m[2].replace(',', '.'));

      // Questao sem PTS no QR: tenta o fallback do comentario; senao, 1 ponto
      const pts = {};
      let faltou = false;
      questoes.forEach(q => {
        if (ptsQR[q] !== undefined) pts[q] = ptsQR[q];
        else { faltou = true; pts[q] = PROVA_PADRAO.pts[q] !== undefined ? PROVA_PADRAO.pts[q] : 1; }
      });
      return {
        id: campos['ID-PROVA'] || null, gab, pts, questoes,
        fonte: !campos['PTS'] ? 'QR Code (sem PTS: pontos padrão)' : faltou ? 'QR Code (PTS parcial)' : 'QR Code', fonteOk: !faltou && !!campos['PTS']
      };
    }

    function definirProva(info) {
      const chave = JSON.stringify([info.id, info.gab, info.pts]);
      if (PROVA && PROVA.chave === chave) return;
      PROVA = { ...info, chave, total: somaPts(info.pts, info.questoes) };
      configurarGeometria(info.questoes.length);
      estavel = 0;
      ultimaChave = null;
      tituloEl.textContent = 'Leitor Óptico' + (PROVA.id ? ` — ${PROVA.id}` : '');
    }

    function usarProvaPadrao() {
      const questoes = Object.keys(PROVA_PADRAO.gab).map(Number).sort((a, b) => a - b);
      definirProva({
        id: PROVA_PADRAO.id, gab: PROVA_PADRAO.gab, pts: PROVA_PADRAO.pts, questoes,
        fonte: 'Padrão (QR Code não lido)', fonteOk: false
      });
    }

    let travado = false;
    let ultimoProc = 0;
    let ultimaChave = null;
    let estavel = 0;
    let deteccao = null;

    async function iniciarCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        mostrarErro('Este navegador não permite acesso à câmera (use HTTPS).');
        return;
      }
      if (typeof jsQR === 'undefined') {
        mostrarErro('Biblioteca de leitura de QR não carregou. Verifique a conexão.');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(r => { video.onloadedmetadata = r; });
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        statusEl.textContent = 'Aponte a câmera para o cartão';
        requestAnimationFrame(loop);
      } catch (e) {
        mostrarErro('Não foi possível acessar a câmera: ' + e.name);
      }
    }

    function mostrarErro(msg) {
      statusEl.className = 'erro';
      statusEl.textContent = msg;
    }

    function loop(t) {
      requestAnimationFrame(loop);
      if (video.readyState < 2) return;
      if (travado) return;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      if (t - ultimoProc > 150) {
        ultimoProc = t;
        processarQuadro();
      }
      desenharDeteccao();
    }

    // ---------- Pre-processamento ----------

    // Escala de cinza + binarizacao adaptativa (imagem integral)
    function binarizar(data, w, h) {
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < w * h; i++, p += 4) {
        gray[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
      }
      const W1 = w + 1;
      const integ = new Float64Array(W1 * (h + 1));
      for (let y = 1; y <= h; y++) {
        let rowSum = 0;
        for (let x = 1; x <= w; x++) {
          rowSum += gray[(y - 1) * w + (x - 1)];
          integ[y * W1 + x] = integ[(y - 1) * W1 + x] + rowSum;
        }
      }
      const r = Math.max(8, Math.round(w / 16));
      const bin = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
        for (let x = 0; x < w; x++) {
          const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
          const area = (x1 - x0) * (y1 - y0);
          const soma = integ[y1 * W1 + x1] - integ[y0 * W1 + x1] - integ[y1 * W1 + x0] + integ[y0 * W1 + x0];
          if (gray[y * w + x] < (soma / area) * 0.75) bin[y * w + x] = 1;
        }
      }
      return { gray, bin };
    }

    // ---------- Deteccao das ancoras ----------

    // Componentes conectados (regioes escuras)
    function acharBlobs(bin, w, h) {
      const vis = new Uint8Array(w * h);
      const stack = new Int32Array(w * h);
      const blobs = [];
      for (let s = 0; s < w * h; s++) {
        if (!bin[s] || vis[s]) continue;
        let sp = 0;
        stack[sp++] = s; vis[s] = 1;
        let minX = w, maxX = 0, minY = h, maxY = 0, n = 0, sx = 0, sy = 0;
        while (sp > 0) {
          const p = stack[--sp];
          const x = p % w, y = (p - x) / w;
          n++; sx += x; sy += y;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          if (x > 0)     { const q = p - 1; if (bin[q] && !vis[q]) { vis[q] = 1; stack[sp++] = q; } }
          if (x < w - 1) { const q = p + 1; if (bin[q] && !vis[q]) { vis[q] = 1; stack[sp++] = q; } }
          if (y > 0)     { const q = p - w; if (bin[q] && !vis[q]) { vis[q] = 1; stack[sp++] = q; } }
          if (y < h - 1) { const q = p + w; if (bin[q] && !vis[q]) { vis[q] = 1; stack[sp++] = q; } }
        }
        blobs.push({ minX, maxX, minY, maxY, n, sx, sy });
      }
      return blobs;
    }

    // Filtra quadrados solidos (ancoras): proporcao ~1, preenchimento alto, tamanho razoavel
    function filtrarQuadrados(blobs, w) {
      const cands = [];
      for (const b of blobs) {
        const bw = b.maxX - b.minX + 1, bh = b.maxY - b.minY + 1;
        const ratio = bw / bh;
        const fill = b.n / (bw * bh);
        if (ratio > 0.7 && ratio < 1.4 && fill > 0.85 && bw >= 8 && bw <= w * 0.25) {
          cands.push({ x: b.sx / b.n, y: b.sy / b.n, area: b.n });
        }
      }
      return cands;
    }

    function areaPoligono(pts) {
      let s = 0;
      for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        s += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
      }
      return Math.abs(s) / 2;
    }

    function ordenarPorAngulo(pts) {
      const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
      const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
      return [...pts].sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
    }

    // Escolhe as 4 ancoras que formam o quadrilatero de maior area
    function escolherQuatro(cands) {
      if (cands.length < 4) return null;
      const c = [...cands].sort((a, b) => b.area - a.area).slice(0, 10);
      if (c.length === 4) return c;
      let melhor = null, melhorArea = -1;
      for (let i = 0; i < c.length; i++)
        for (let j = i + 1; j < c.length; j++)
          for (let k = j + 1; k < c.length; k++)
            for (let l = k + 1; l < c.length; l++) {
              const quad = ordenarPorAngulo([c[i], c[j], c[k], c[l]]);
              const a = areaPoligono(quad);
              if (a > melhorArea) { melhorArea = a; melhor = [c[i], c[j], c[k], c[l]]; }
            }
      return melhor;
    }

    // Identifica TL, TR, BR, BL usando a orientacao do QR Code (funciona na vertical e na horizontal)
    function ordenarCantos(pts, qr) {
      const cx = pts.reduce((a, p) => a + p.x, 0) / 4;
      const cy = pts.reduce((a, p) => a + p.y, 0) / 4;
      let ex = { x: 1, y: 0 }, ey = { x: 0, y: 1 };
      if (qr) {
        const L = qr.location;
        const tx = L.topRightCorner.x - L.topLeftCorner.x, ty = L.topRightCorner.y - L.topLeftCorner.y;
        const nx = Math.hypot(tx, ty);
        ex = { x: tx / nx, y: ty / nx };
        const bx = L.bottomLeftCorner.x - L.topLeftCorner.x, by = L.bottomLeftCorner.y - L.topLeftCorner.y;
        const ny = Math.hypot(bx, by);
        ey = { x: bx / ny, y: by / ny };
      }
      const proj = pts.map(p => {
        const dx = p.x - cx, dy = p.y - cy;
        return { p, a: dx * ex.x + dy * ex.y, b: dx * ey.x + dy * ey.y };
      });
      const maxBy = f => proj.reduce((m, c) => (f(c) > f(m) ? c : m)).p;
      return {
        TL: maxBy(c => -(c.a + c.b)),
        TR: maxBy(c => c.a - c.b),
        BR: maxBy(c => c.a + c.b),
        BL: maxBy(c => -(c.a - c.b))
      };
    }

    // ---------- Homografia ----------

    function resolverLinear(A, b) {
      const n = b.length;
      const M = A.map((r, i) => [...r, b[i]]);
      for (let c = 0; c < n; c++) {
        let p = c;
        for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
        [M[c], M[p]] = [M[p], M[c]];
        if (Math.abs(M[c][c]) < 1e-12) return null;
        for (let r = 0; r < n; r++) {
          if (r === c) continue;
          const f = M[r][c] / M[c][c];
          for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
        }
      }
      return M.map((r, i) => r[n] / r[i]);
    }

    // Homografia que leva pontos do cartao (cm) para pixels da imagem
    function homografia(src, dst) {
      const A = [], b = [];
      for (let i = 0; i < 4; i++) {
        const { x, y } = src[i], { x: u, y: v } = dst[i];
        A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
        A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
      }
      return resolverLinear(A, b);
    }

    function aplicarH(h, x, y) {
      const d = h[6] * x + h[7] * y + 1;
      return { x: (h[0] * x + h[1] * y + h[2]) / d, y: (h[3] * x + h[4] * y + h[5]) / d };
    }

    // Retifica o cartao em uma imagem plana (cinza)
    function retificar(gray, w, h, H) {
      const S = CFG.escala;
      const RW = Math.round(CARTAO.W * S), RH = Math.round(CARTAO.H * S);
      const out = new Uint8Array(RW * RH);
      for (let Y = 0; Y < RH; Y++) {
        for (let X = 0; X < RW; X++) {
          const p = aplicarH(H, X / S, Y / S);
          const u = Math.round(p.x), v = Math.round(p.y);
          out[Y * RW + X] = (u >= 0 && u < w && v >= 0 && v < h) ? gray[v * w + u] : 255;
        }
      }
      return { out, RW, RH };
    }

    function percentil(arr, p) {
      const hist = new Uint32Array(256);
      for (let i = 0; i < arr.length; i++) hist[arr[i]]++;
      const alvo = arr.length * p;
      let acc = 0;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= alvo) return i; }
      return 255;
    }

    // ---------- Leitura das bolhas ----------

    // Fracao de pixels escuros em um anel interno da bolha (ignora contorno e letra)
    function medirPreenchimento(rect, cxCm, cyCm, paper) {
      const S = CFG.escala;
      const cx = cxCm * S, cy = cyCm * S;
      const rb = CFG.raioBolha * S;
      const rin = rb * 0.35, rout = rb * 0.8;
      let tot = 0, esc = 0;
      const R = Math.ceil(rout);
      for (let dy = -R; dy <= R; dy++) {
        for (let dx = -R; dx <= R; dx++) {
          const d = Math.hypot(dx, dy);
          if (d < rin || d > rout) continue;
          const x = Math.round(cx + dx), y = Math.round(cy + dy);
          if (x < 0 || x >= rect.RW || y < 0 || y >= rect.RH) continue;
          tot++;
          if (rect.out[y * rect.RW + x] < paper * 0.6) esc++;
        }
      }
      return tot > 0 ? esc / tot : 0;
    }

    function lerRespostas(rect, paper, H) {
      return CFG.questoesY.map((qy, i) => {
        const cyCm = CARTAO.y0 - qy;
        const marks = CFG.opcoesX.map((ox, j) => {
          const cxCm = ox - CARTAO.x0;
          const f = medirPreenchimento(rect, cxCm, cyCm, paper);
          const pImg = aplicarH(H, cxCm, cyCm);
          return { letra: CFG.letras[j], f, cheia: f >= CFG.limiarPreench, px: pImg.x, py: pImg.y };
        });
        const cheias = marks.filter(m => m.cheia);
        const marcada = cheias.length === 0 ? '-' : cheias.length === 1 ? cheias[0].letra : '*';
        return { q: PROVA.questoes[i], marcada, marks };
      });
    }

    // ---------- Processamento principal ----------

    function processarQuadro() {
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const { data, width: w, height: h } = img;

      const qr = jsQR(data, w, h, { inversionAttempts: 'dontInvert' });
      if (qr) {
        const info = interpretarQR(qr.data);
        if (info) definirProva(info);
      }
      if (!PROVA) usarProvaPadrao();   // fallback ate o QR ser lido
      const { gray, bin } = binarizar(data, w, h);
      const cands = filtrarQuadrados(acharBlobs(bin, w, h), w);
      const quad = escolherQuatro(cands);

      if (!quad) {
        deteccao = null;
        estavel = 0;
        ultimaChave = null;
        statusEl.className = '';
        statusEl.textContent = `Procurando o cartão... (âncoras: ${Math.min(cands.length, 4)}/4)`;
        return;
      }

      const cantos = ordenarCantos(quad, qr);
      const H = homografia(
        [{ x: 0, y: 0 }, { x: CARTAO.W, y: 0 }, { x: CARTAO.W, y: CARTAO.H }, { x: 0, y: CARTAO.H }],
        [cantos.TL, cantos.TR, cantos.BR, cantos.BL]
      );
      if (!H) { estavel = 0; return; }

      const rect = retificar(gray, w, h, H);
      const paper = percentil(rect.out, 0.8);
      const respostas = lerRespostas(rect, paper, H);

      deteccao = {
        cantos: [cantos.TL, cantos.TR, cantos.BR, cantos.BL],
        bolhas: respostas.flatMap(r => r.marks)
      };

      const duplas = respostas.filter(r => r.marcada === '*').map(r => r.q);
      if (duplas.length) {
        estavel = 0;
        ultimaChave = null;
        statusEl.className = '';
        statusEl.textContent = `Dupla marcação na questão ${duplas.join(', ')}. Corrija o cartão.`;
        return;
      }

      const chave = respostas.map(r => r.marcada).join('');
      if (chave === ultimaChave) estavel++;
      else { ultimaChave = chave; estavel = 1; }

      statusEl.className = '';
      statusEl.textContent = `Cartão detectado, mantenha firme... (${estavel}/${CFG.estaveis})`;

      if (estavel >= CFG.estaveis) exibirResultado(respostas);
    }

    function desenharDeteccao() {
      if (!deteccao) return;
      const c = deteccao.cantos;
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00e676';
      ctx.beginPath();
      ctx.moveTo(c[0].x, c[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
      ctx.closePath();
      ctx.stroke();

      deteccao.bolhas.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.px, b.py, 6, 0, Math.PI * 2);
        ctx.fillStyle = b.cheia ? '#00e676' : 'rgba(41,121,255,0.6)';
        ctx.fill();
      });
    }

    // ---------- Resultado ----------

    function exibirResultado(respostas) {
      travado = true;
      statusEl.className = 'ok';
      statusEl.textContent = 'Cartão lido com sucesso!';
      let acertos = 0, nota = 0;
      const html = respostas.map(r => {
        const gab = PROVA.gab[r.q];
        const max = PROVA.pts[r.q] || 0;
        const ok = r.marcada === gab;
        const ganho = ok ? max : 0;
        if (ok) acertos++;
        nota += ganho;
        const txt = r.marcada === '-' ? 'Em branco' : r.marcada === '*' ? 'Dupla' : r.marcada;
        return `<div class="item-q ${ok ? 'correta' : 'errada'}">
          <strong>Questão ${String(r.q).padStart(2, '0')}:</strong> Marcada <b>${txt}</b> (Gab: ${gab})
          <span class="pts">${formatarPts(ganho)} / ${formatarPts(max)} pts</span>
        </div>`;
      }).join('');
      nota = Math.round(nota * 100) / 100;
      document.getElementById('notaTexto').textContent = `Nota: ${formatarPts(nota)} / ${formatarPts(PROVA.total)}`;
      document.getElementById('subNota').textContent = `Acertos: ${acertos} / ${respostas.length}`;
      const fonteEl = document.getElementById('fonteProva');
      fonteEl.textContent = `Gabarito e pontuação: ${PROVA.fonte}`;
      fonteEl.className = 'fonte' + (PROVA.fonteOk ? '' : ' aviso');
      document.getElementById('detalhesQuestoes').innerHTML = html;
      resultadoEl.style.display = 'block';
    }

    function reiniciarLeitura() {
      travado = false;
      estavel = 0;
      ultimaChave = null;
      deteccao = null;
      resultadoEl.style.display = 'none';
      statusEl.className = '';
      statusEl.textContent = 'Aponte a câmera para o próximo cartão...';
    }

    iniciarCamera();
  </script>
</body>
</html>
