<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Leitor Óptico - Pontuação</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; text-align: center; background: #121212; color: #f5f5f5; margin: 0; padding: 12px; }
    .container { max-width: 600px; margin: 0 auto; }
    h3 { margin: 6px 0 10px; }
    #status { padding: 14px; margin: 8px 0; border-radius: 8px; background: #1e1e1e; color: #ffd54f; font-weight: bold; font-size: 16px; }
    #status.ok { color: #00e676; border: 2px solid #00e676; font-size: 19px; }
    #status.erro { color: #ff5252; }
    video { display: none; }
    canvas { display: block; width: 100%; border-radius: 10px; border: 2px solid #333; background: #000; }
    .controles { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    button { background: #2979ff; color: white; border: none; padding: 12px 16px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button.secundario { background: #424242; }
    table { width: 100%; margin-top: 12px; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #333; padding: 9px 5px; font-size: 12px; }
    th { background: #262626; color: #bbb; }
    .preview-box { margin-top: 12px; }
    .preview-box span { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    #canvasDebug { max-width: 340px; margin: 0 auto; }
  </style>
</head>
<body>
<div class="container">
  <h3>Leitor Óptico (v3 - Leve e Preciso)</h3>
  <div id="status">Iniciando câmera...</div>

  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvasOutput"></canvas>

  <div class="controles">
    <button onclick="permitirReleitura()">Ler Próxima Prova</button>
    <button class="secundario" onclick="baixarCSV()">Baixar CSV</button>
    <button class="secundario" onclick="reiniciarCamera()">Reiniciar Câmera</button>
  </div>

  <table id="tabelaResultados">
    <thead>
      <tr>
        <th>ID Prova</th>
        <th>Gabarito</th>
        <th>Lido</th>
        <th>Acertos</th>
        <th>Nota (Max 3,0)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="preview-box">
    <span>Diagnóstico (verifique os 4 cantos verdes e os anéis):</span>
    <canvas id="canvasDebug"></canvas>
  </div>
</div>

<script>
"use strict";

const QUESTOES = [
  { numero: "Q5", peso: 2.0, y: 0.5242, xA: 0.3242, xB: 0.4414, xC: 0.5586, xD: 0.6758, xE: 0.7930 },
  { numero: "Q6", peso: 1.0, y: 0.6855, xA: 0.3242, xB: 0.4414, xC: 0.5586, xD: 0.6758, xE: 0.7930 }
];

let resultados = [];
let ultimoQRBloqueado = "";
let streamCamera = null;
let cameraAtiva = false;

const video = document.getElementById("video");
const canvas = document.getElementById("canvasOutput");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const debugCanvas = document.getElementById("canvasDebug");
const debugCtx = debugCanvas.getContext("2d");

function setStatus(msg, classe = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = classe;
}

function iniciarTudo() {
  abrirCamera();
  const s = document.createElement("script");
  s.src = "https://jsdelivr.net" + "/npm/jsqr@1.4.0/dist/jsQR.js";
  s.onload = () => {
    if (cameraAtiva) setStatus("Aponte para o cartão (4 cantos + QR Code)");
  };
  s.onerror = () => setStatus("Erro de rede ao carregar leitor QR.", "erro");
  document.head.appendChild(s);
}

async function abrirCamera() {
  if (cameraAtiva) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    streamCamera = stream;
    video.srcObject = stream;
    await video.play();
    cameraAtiva = true;
    setStatus(typeof window.jsQR === "function" ? "Aponte para o cartão (4 cantos + QR Code)" : "Câmera ativa! Carregando leitor QR...");
    requestAnimationFrame(loopCaptura);
  } catch (err) {
    setStatus("Erro na câmera: " + err.message, "erro");
  }
}

function reiniciarCamera() {
  if (streamCamera) streamCamera.getTracks().forEach(t => t.stop());
  cameraAtiva = false;
  abrirCamera();
}

function permitirReleitura() {
  ultimoQRBloqueado = "";
  setStatus("Pronto! Aponte para a próxima prova.");
}

function extrairDadosQR(texto) {
  let idProva = texto;
  let gabQ5 = "C";
  let gabQ6 = "A";

  const partes = texto.split(";");
  for (let i = 0; i < partes.length; i++) {
    const p = partes.at(i);
    if (!p) continue;
    if (p.startsWith("ID-PROVA:")) {
      idProva = p.replace("ID-PROVA:", "").trim();
    } else if (p.startsWith("GAB:")) {
      const itens = p.replace("GAB:", "").split("-");
      for (let j = 0; j < itens.length; j++) {
        const it = itens.at(j).toUpperCase();
        if (it.startsWith("Q5") && it.length === 3) gabQ5 = it.charAt(2);
        if (it.startsWith("Q6") && it.length === 3) gabQ6 = it.charAt(2);
      }
    }
  }
  return { idProva, gabQ5, gabQ6 };
}

function loopCaptura() {
  if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (typeof window.jsQR === "function") {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const qr = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

      if (qr) {
        ctx.strokeStyle = "#00b0ff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(qr.location.topLeftCorner.x, qr.location.topLeftCorner.y);
        ctx.lineTo(qr.location.topRightCorner.x, qr.location.topRightCorner.y);
        ctx.lineTo(qr.location.bottomRightCorner.x, qr.location.bottomRightCorner.y);
        ctx.lineTo(qr.location.bottomLeftCorner.x, qr.location.bottomLeftCorner.y);
        ctx.closePath();
        ctx.stroke();

        if (qr.data !== ultimoQRBloqueado) {
          const resultado = processarCartao(imgData, qr);
          if (resultado) {
            ultimoQRBloqueado = qr.data;
            adicionarLinhaTabela(resultado);
            if (navigator.vibrate) navigator.vibrate(200);
            setStatus(
              `NOTA: ${resultado.notaTexto} / 3,0 pts | Acertos: ${resultado.acertos}/2 (${resultado.respostasTexto})`,
              "ok"
            );
          }
        }
      }
    }
  }
  requestAnimationFrame(loopCaptura);
}
function processarCartao(imgData, qr) {
  const W = imgData.width;
  const H = imgData.height;
  const data = imgData.data;

  const gray = new Uint8Array(W * H);
  let soma = 0;
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const lum = (data.at(i) * 77 + data.at(i + 1) * 150 + data.at(i + 2) * 29) >> 8;
    gray[p] = lum;
    soma += lum;
  }
  const limiar = (soma / (W * H)) * 0.65;

  const qrCx = (qr.location.topLeftCorner.x + qr.location.bottomRightCorner.x) / 2;
  const qrCy = (qr.location.topLeftCorner.y + qr.location.bottomRightCorner.y) / 2;
  const qrTam = Math.hypot(
    qr.location.topRightCorner.x - qr.location.topLeftCorner.x,
    qr.location.topRightCorner.y - qr.location.topLeftCorner.y
  );

  const raioMaximoBusca = qrTam * 9.5;
  const minArea = Math.max(40, Math.round(qrTam * qrTam * 0.04));
  const maxArea = Math.round(qrTam * qrTam * 0.65);

  const visitado = new Uint8Array(W * H);
  const stackX = new Int32Array(maxArea + 500);
  const stackY = new Int32Array(maxArea + 500);
  let candidatos = [];

  for (let y = 6; y < H - 6; y += 2) {
    for (let x = 6; x < W - 6; x += 2) {
      const idx = y * W + x;
      if (gray[idx] < limiar && visitado[idx] === 0) {
        let top = 0;
        stackX[top] = x;
        stackY[top] = y;
        visitado[idx] = 1;

        let count = 0, minX = x, maxX = x, minY = y, maxY = y;
        while (top >= 0) {
          const cx = stackX[top];
          const cy = stackY[top];
          top--;
          count++;

          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;
          if (count > maxArea) break;

          if (cx + 1 < W) {
            const n1 = cy * W + (cx + 1);
            if (visitado[n1] === 0 && gray[n1] < limiar) {
              visitado[n1] = 1; top++; stackX[top] = cx + 1; stackY[top] = cy;
            }
          }
          if (cx - 1 >= 0) {
            const n2 = cy * W + (cx - 1);
            if (visitado[n2] === 0 && gray[n2] < limiar) {
              visitado[n2] = 1; top++; stackX[top] = cx - 1; stackY[top] = cy;
            }
          }
          if (cy + 1 < H) {
            const n3 = (cy + 1) * W + cx;
            if (visitado[n3] === 0 && gray[n3] < limiar) {
              visitado[n3] = 1; top++; stackX[top] = cx; stackY[top] = cy + 1;
            }
          }
          if (cy - 1 >= 0) {
            const n4 = (cy - 1) * W + cx;
            if (visitado[n4] === 0 && gray[n4] < limiar) {
              visitado[n4] = 1; top++; stackX[top] = cx; stackY[top] = cy - 1;
            }
          }
        }

        if (count >= minArea && count <= maxArea) {
          const bw = maxX - minX + 1;
          const bh = maxY - minY + 1;
          const ratio = bw / bh;
          const centX = (minX + maxX) / 2;
          const centY = (minY + maxY) / 2;
          const distQR = Math.hypot(centX - qrCx, centY - qrCy);

          if (distQR > qrTam * 0.70 && distQR < raioMaximoBusca && ratio >= 0.65 && ratio <= 1.50) {
            candidatos.push({ x: centX, y: centY, area: count, minX, minY, bw, bh });
          }
        }
      }
    }
  }

  if (candidatos.length > 4) {
    candidatos.sort((a, b) => b.area - a.area);
    candidatos = candidatos.slice(0, 4);
  }
  if (candidatos.length !== 4) return null;

  ctx.strokeStyle = "#00e676";
  ctx.lineWidth = 5;
  candidatos.forEach(c => ctx.strokeRect(c.minX, c.minY, c.bw, c.bh));

  const mX = candidatos.reduce((s, c) => s + c.x, 0) / 4;
  const mY = candidatos.reduce((s, c) => s + c.y, 0) / 4;
  candidatos.sort((a, b) => Math.atan2(a.y - mY, a.x - mX) - Math.atan2(b.y - mY, b.x - mX));

  let idxQR = 0, menorD = Infinity;
  candidatos.forEach((c, idx) => {
    const d = Math.hypot(c.x - qrCx, c.y - qrCy);
    if (d < menorD) { menorD = d; idxQR = idx; }
  });

  const supDir = candidatos.at(idxQR);
  const infDir = candidatos.at((idxQR + 1) % 4);
  const infEsq = candidatos.at((idxQR + 2) % 4);
  const supEsq = candidatos.at((idxQR + 3) % 4);

  function mapearPonto(u, v) {
    const topX = supEsq.x + (supDir.x - supEsq.x) * u;
    const topY = supEsq.y + (supDir.y - supEsq.y) * u;
    const botX = infEsq.x + (infDir.x - infEsq.x) * u;
    const botY = infEsq.y + (infDir.y - infEsq.y) * u;
    return {
      x: Math.round(topX + (botX - topX) * v),
      y: Math.round(topY + (botY - topY) * v)
    };
  }

  debugCanvas.width = W;
  debugCanvas.height = H;
  debugCtx.putImageData(imgData, 0, 0);

  debugCtx.fillStyle = "#00e676";
  debugCtx.font = "bold 22px sans-serif";
  debugCtx.fillText("SE", supEsq.x, supEsq.y);
  debugCtx.fillText("SD", supDir.x, supDir.y);
  debugCtx.fillText("ID", infDir.x, infDir.y);
  debugCtx.fillText("IE", infEsq.x, infEsq.y);

  const larguraCartaoPx = Math.hypot(supDir.x - supEsq.x, supDir.y - supEsq.y);
  const raioExterno = Math.max(8, Math.round(larguraCartaoPx * 0.017));
  const raioInterno = Math.max(3, Math.round(raioExterno * 0.42));

  const dadosQR = extrairDadosQR(qr.data);
  let respostasLidas = [];
  let acertos = 0;
  let notaTotal = 0;

  QUESTOES.forEach(q => {
    const listaOpcoes = [
      { letra: "A", propX: q.xA },
      { letra: "B", propX: q.xB },
      { letra: "C", propX: q.xC },
      { letra: "D", propX: q.xD },
      { letra: "E", propX: q.xE }
    ];

    let medicoes = [];
    listaOpcoes.forEach(op => {
      const pt = mapearPonto(op.propX, q.y);
      let somaLum = 0;
      let totalPx = 0;

      for (let dy = -raioExterno; dy <= raioExterno; dy++) {
        for (let dx = -raioExterno; dx <= raioExterno; dx++) {
          const d2 = dx * dx + dy * dy;
          if (d2 >= raioInterno * raioInterno && d2 <= raioExterno * raioExterno) {
            const px = pt.x + dx;
            const py = pt.y + dy;
            if (px >= 0 && px < W && py >= 0 && py < H) {
              somaLum += gray[py * W + px];
              totalPx++;
            }
          }
        }
      }

      const escuridao = 255 - (somaLum / Math.max(1, totalPx));
      medicoes.push({ letra: op.letra, escuridao, pt });

      debugCtx.strokeStyle = "red";
      debugCtx.lineWidth = 2;
      debugCtx.beginPath();
      debugCtx.arc(pt.x, pt.y, raioExterno, 0, Math.PI * 2);
      debugCtx.stroke();
      debugCtx.beginPath();
      debugCtx.arc(pt.x, pt.y, raioInterno, 0, Math.PI * 2);
      debugCtx.stroke();
    });

    medicoes.sort((a, b) => b.escuridao - a.escuridao);
    const maisEscura = medicoes.at(0);
    const segunda = medicoes.at(1);
    const mediaVazias = (medicoes.at(1).escuridao + medicoes.at(2).escuridao + medicoes.at(3).escuridao + medicoes.at(4).escuridao) / 4;

    let marcada = "-";
    if (maisEscura.escuridao - mediaVazias > 20 && (maisEscura.escuridao - segunda.escuridao) > 12) {
      marcada = maisEscura.letra;
      debugCtx.strokeStyle = "#00e676";
      debugCtx.lineWidth = 5;
      debugCtx.beginPath();
      debugCtx.arc(maisEscura.pt.x, maisEscura.pt.y, raioExterno + 4, 0, Math.PI * 2);
      debugCtx.stroke();
    } else if (maisEscura.escuridao - mediaVazias > 20 && (segunda.escuridao - mediaVazias) > 20) {
      marcada = "DUPLA";
    }

    const gabaritoQuestao = q.numero === "Q5" ? dadosQR.gabQ5 : dadosQR.gabQ6;
    const acertou = marcada === gabaritoQuestao;
    if (acertou) {
      acertos++;
      notaTotal += q.peso;
    }

    respostasLidas.push(`${q.numero}:${marcada}${acertou ? "✓" : "✗"}`);
  });

  return {
    idProva: dadosQR.idProva,
    gabaritoTexto: `Q5:${dadosQR.gabQ5} Q6:${dadosQR.gabQ6}`,
    respostasTexto: respostasLidas.join(" | "),
    acertos,
    notaTexto: notaTotal.toFixed(1).replace(".", ",")
  };
}

function adicionarLinhaTabela(item) {
  resultados.push(item);
  const tbody = document.querySelector("#tabelaResultados tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><strong>${item.idProva}</strong></td>
    <td>${item.gabaritoTexto}</td>
    <td>${item.respostasTexto}</td>
    <td>${item.acertos}/2</td>
    <td style="color:#00e676;font-size:14px;"><strong>${item.notaTexto}</strong></td>
  `;
  tbody.prepend(tr);
}

function baixarCSV() {
  let csv = "ID_Prova;Gabarito;Respostas_Lidas;Acertos;Nota_Max_3\n";
  resultados.forEach(r => {
    csv += `${r.idProva};${r.gabaritoTexto};${r.respostasTexto};${r.acertos};${r.notaTexto}\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "notas_provas.csv";
  link.click();
}

iniciarTudo();
</script>
</body>
</html>
