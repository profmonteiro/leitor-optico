<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor Óptico - Validação LaTeX</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; background: #121212; color: #f5f5f5; margin: 0; padding: 12px; }
    .container { max-width: 540px; margin: 0 auto; }
    canvas { width: 100%; border-radius: 10px; border: 2px solid #333; background: #000; }
    #status { padding: 12px; margin: 8px 0; border-radius: 8px; background: #1e1e1e; font-weight: bold; color: #00e676; font-size: 16px; }
    .controles { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    button { background: #2979ff; color: white; border: none; padding: 12px 18px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button.secundario { background: #424242; }
    table { width: 100%; margin-top: 12px; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #333; padding: 10px 6px; font-size: 14px; }
    th { background: #262626; color: #bbb; }
    .preview-box { margin-top: 12px; }
    .preview-box span { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    #canvasDebug { max-width: 340px; border: 1px solid #444; }
  </style>
</head>
<body>
<div class="container">
  <h3>Leitor Óptico (Cartão LaTeX)</h3>
  <div id="status">Carregando leitor...</div>

  <video id="video" playsinline muted autoplay style="display:none;"></video>
  <canvas id="canvasOutput"></canvas>

  <div class="controles">
    <button onclick="baixarCSV()">Baixar Planilha (CSV)</button>
    <button class="secundario" onclick="permitirReleitura()">Ler Próxima / Relê Atual</button>
  </div>

  <table id="tabelaResultados">
    <thead>
      <tr>
        <th>ID Prova</th>
        <th>Gabarito</th>
        <th>Lido (Q5 / Q6)</th>
        <th>Nota</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="preview-box">
    <span>Diagnóstico (bolinhas verificadas):</span>
    <canvas id="canvasDebug"></canvas>
  </div>
</div>

<script>
const COORDENADAS_QUESTOES = [
  { numero: "Q5", y: 0.5242, opcoes: { A: 0.3242, B: 0.4414, C: 0.5586, D: 0.6758, E: 0.7930 } },
  { numero: "Q6", y: 0.6855, opcoes: { A: 0.3242, B: 0.4414, C: 0.5586, D: 0.6758, E: 0.7930 } }
];

let ultimoQRBloqueado = "";
let resultados = [];

// Carrega apenas o jsQR (ultraleve, 45 KB) e abre a câmera na hora
const scriptQR = document.createElement('script');
scriptQR.src = 'https://jsdelivr.net' + '/npm/jsqr@1.4.0/dist/jsQR.min.js';
scriptQR.onload = () => iniciarCamera();
document.head.appendChild(scriptQR);

async function iniciarCamera() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    document.getElementById('status').innerText = "Aponte para o cartão (4 cantos + QR)";
    requestAnimationFrame(processarFrame);
  } catch (err) {
    document.getElementById('status').innerText = "Erro na câmera: " + err.message;
  }
}

function permitirReleitura() {
  ultimoQRBloqueado = "";
  document.getElementById('status').innerText = "Pronto! Aponte para o cartão.";
}

function extrairDadosQR(textoQR) {
  let idProva = textoQR;
  let gabarito = { Q5: "C", Q6: "A" };
  textoQR.split(";").forEach(p => {
    if (p.startsWith("ID-PROVA:")) idProva = p.replace("ID-PROVA:", "").trim();
    if (p.startsWith("GAB:")) {
      p.replace("GAB:", "").split("-").forEach(item => {
        const m = item.match(/^(Q\d+)([A-E])$/i);
        if (m) gabarito[m.toUpperCase()] = m.toUpperCase();
      });
    }
  });
  return { idProva, gabarito };
}
function processarFrame() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvasOutput');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  if (video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR !== 'undefined') {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qrCode = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

    if (qrCode) {
      ctx.strokeStyle = "#00b0ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(qrCode.location.topLeftCorner.x, qrCode.location.topLeftCorner.y);
      ctx.lineTo(qrCode.location.topRightCorner.x, qrCode.location.topRightCorner.y);
      ctx.lineTo(qrCode.location.bottomRightCorner.x, qrCode.location.bottomRightCorner.y);
      ctx.lineTo(qrCode.location.bottomLeftCorner.x, qrCode.location.bottomLeftCorner.y);
      ctx.closePath();
      ctx.stroke();

      if (qrCode.data !== ultimoQRBloqueado) {
        const leitura = detectarELerNativo(imageData, ctx, qrCode);
        if (leitura) {
          ultimoQRBloqueado = qrCode.data;
          registrarResultado(leitura);
          if (navigator.vibrate) navigator.vibrate();
          document.getElementById('status').innerText = `Lido: ${leitura.idProva} | Acertos: ${leitura.acertos}/${COORDENADAS_QUESTOES.length}`;
        }
      }
    }
  }
  requestAnimationFrame(processarFrame);
}

// Motor óptico 100% nativo em JavaScript (zero bibliotecas pesadas)
function detectarELerNativo(imageData, ctx, qrCode) {
  const W = imageData.width;
  const H = imageData.height;
  const data = imageData.data;

  // 1. Converte para luminância e calcula limiar adaptativo global rápido
  const gray = new Uint8Array(W * H);
  let soma = 0;
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    const lum = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
    gray[j] = lum;
    soma += lum;
  }
  const limiar = (soma / (W * H)) * 0.68; // Tudo abaixo disso é tinta preta

  // 2. Encontra componentes conectados (manchas pretas) para achar os 4 marcadores de canto
  const visitado = new Uint8Array(W * H);
  const qrCx = (qrCode.location.topLeftCorner.x + qrCode.location.bottomRightCorner.x) / 2;
  const qrCy = (qrCode.location.topLeftCorner.y + qrCode.location.bottomRightCorner.y) / 2;
  const qrTam = Math.hypot(
    qrCode.location.topRightCorner.x - qrCode.location.topLeftCorner.x,
    qrCode.location.topRightCorner.y - qrCode.location.topLeftCorner.y
  );

  const minPixels = (W * H) * 0.00025;
  const maxPixels = (W * H) * 0.018;
  let candidatos = [];
  const stackX = new Int32Array(maxPixels + 100);
  const stackY = new Int32Array(maxPixels + 100);

  for (let y = 10; y < H - 10; y += 2) {
    for (let x = 10; x < W - 10; x += 2) {
      const idx = y * W + x;
      if (gray[idx] < limiar && !visitado[idx]) {
        let top = 0;
        stackX[top] = x;
        stackY[top] = y;
        visitado[idx] = 1;

        let count = 0, minX = x, maxX = x, minY = y, maxY = y;
        while (top >= 0) {
          const cx = stackX[top];
          const cy = stackY[top];
          top--;
          count++;

          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;

          if (count > maxPixels) break;

          // Vizinhos 4-conectados
          const viz = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
          for (let k = 0; k < 4; k++) {
            const nx = viz[k], ny = viz[k];
            if (nx > 0 && nx < W && ny > 0 && ny < H) {
              const nIdx = ny * W + nx;
              if (!visitado[nIdx] && gray[nIdx] < limiar) {
                visitado[nIdx] = 1;
                top++;
                stackX[top] = nx;
                stackY[top] = ny;
              }
            }
          }
        }

        if (count >= minPixels && count <= maxPixels) {
          const bw = maxX - minX + 1;
          const bh = maxY - minY + 1;
          const ratio = bw / bh;
          const centX = (minX + maxX) / 2;
          const centY = (minY + maxY) / 2;

          // Ignora elementos dentro do QR Code e aceita quadrados/cantoneiras nos cantos
          if (Math.hypot(centX - qrCx, centY - qrCy) > qrTam * 0.65 && ratio >= 0.68 && ratio <= 1.45) {
            candidatos.push({ x: centX, y: centY, area: count, rect: { x: minX, y: minY, w: bw, h: bh } });
          }
        }
      }
    }
  }

  if (candidatos.length > 4) {
    candidatos.sort((a, b) => b.area - a.area);
    candidatos = candidatos.slice(0, 4);
  }
  if (candidatos.length !== 4) return null;

  // Desenha os 4 cantos detectados em verde
  ctx.strokeStyle = "#00e676";
  ctx.lineWidth = 5;
  candidatos.forEach(c => ctx.strokeRect(c.rect.x, c.rect.y, c.rect.w, c.rect.h));

  // Ordena os 4 cantos em sentido horário e orienta pelo QR Code (Superior Direito)
  const mX = candidatos.reduce((s, c) => s + c.x, 0) / 4;
  const mY = candidatos.reduce((s, c) => s + c.y, 0) / 4;
  candidatos.sort((a, b) => Math.atan2(a.y - mY, a.x - mX) - Math.atan2(b.y - mY, b.x - mX));

  let idxQR = 0, menorD = Infinity;
  candidatos.forEach((c, idx) => {
    const d = Math.hypot(c.x - qrCx, c.y - qrCy);
    if (d < menorD) { menorD = d; idxQR = idx; }
  });

  const supDir = candidatos[idxQR];
  const infDir = candidatos[(idxQR + 1) % 4];
  const infEsq = candidatos[(idxQR + 2) % 4];
  const supEsq = candidatos[(idxQR + 3) % 4];

  // 3. Mapeamento bilinear direto dos pontos (sem precisar retificar a imagem inteira!)
  function mapearPonto(u, v) {
    const topX = supEsq.x + (supDir.x - supEsq.x) * u;
    const topY = supEsq.y + (supDir.y - supEsq.y) * u;
    const botX = infEsq.x + (infDir.x - infEsq.x) * u;
    const botY = infEsq.y + (infDir.y - infEsq.y) * u;
    return {
      x: Math.round(topX + (botX - topX) * v),
      y: Math.round(topY + (botY - topY) * v)
    };
  }

  // Prepara canvas de diagnóstico com o recorte da imagem atual
  const debugCanvas = document.getElementById('canvasDebug');
  debugCanvas.width = W;
  debugCanvas.height = H;
  const dCtx = debugCanvas.getContext('2d');
  dCtx.putImageData(imageData, 0, 0);

  const raioAmostra = Math.max(4, Math.round(Math.hypot(supDir.x - supEsq.x, supDir.y - supEsq.y) * 0.013));
  const { idProva, gabarito } = extrairDadosQR(qrCode.data);
  let respostasLidas = [];
  let acertos = 0;

  COORDENADAS_QUESTOES.forEach(q => {
    let melhor = { letra: "-", escuros: 0, pt: null };
    let segundo = 0;
    let totalPixels = 0;

    for (const [letra, propX] of Object.entries(q.opcoes)) {
      const pt = mapearPonto(propX, q.y);
      let escuros = 0;
      totalPixels = 0;

      for (let dy = -raioAmostra; dy <= raioAmostra; dy++) {
        for (let dx = -raioAmostra; dx <= raioAmostra; dx++) {
          if (dx * dx + dy * dy <= raioAmostra * raioAmostra) {
            const px = pt.x + dx;
            const py = pt.y + dy;
            if (px >= 0 && px < W && py >= 0 && py < H) {
              totalPixels++;
              if (gray[py * W + px] < limiar) escuros++;
            }
          }
        }
      }

      // Desenha mira vermelha no diagnóstico
      dCtx.strokeStyle = "red";
      dCtx.lineWidth = 3;
      dCtx.beginPath();
      dCtx.arc(pt.x, pt.y, raioAmostra + 2, 0, Math.PI * 2);
      dCtx.stroke();

      if (escuros > melhor.escuros) {
        segundo = melhor.escuros;
        melhor = { letra, escuros, pt };
      } else if (escuros > segundo) {
        segundo = escuros;
      }
    }

    let marcada = "-";
    if (melhor.escuros > totalPixels * 0.45 && melhor.escuros > segundo * 1.35) {
      marcada = melhor.letra;
      dCtx.strokeStyle = "#00e676";
      dCtx.lineWidth = 5;
      dCtx.beginPath();
      dCtx.arc(melhor.pt.x, melhor.pt.y, raioAmostra + 6, 0, Math.PI * 2);
      dCtx.stroke();
    } else if (melhor.escuros > totalPixels * 0.45 && segundo > totalPixels * 0.45) {
      marcada = "DUPLA";
    }

    respostasLidas.push(`${q.numero}:${marcada}`);
    if (marcada === gabarito[q.numero]) acertos++;
  });

  return {
    idProva,
    gabaritoTexto: Object.entries(gabarito).map(([k, v]) => `${k}:${v}`).join(" "),
    respostasTexto: respostasLidas.join(" | "),
    acertos
  };
}

function registrarResultado(item) {
  resultados.push(item);
  const tbody = document.querySelector("#tabelaResultados tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><strong>${item.idProva}</strong></td><td>${item.gabaritoTexto}</td><td>${item.respostasTexto}</td><td><strong>${item.acertos}/${COORDENADAS_QUESTOES.length}</strong></td>`;
  tbody.prepend(tr);
}

function baixarCSV() {
  let csv = "ID_Prova;Gabarito_QR;Respostas_Lidas;Acertos\n";
  resultados.forEach(r => { csv += `${r.idProva};${r.gabaritoTexto};${r.respostasTexto};${r.acertos}\n`; });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "validacao_optica.csv";
  link.click();
}
</script>
</body>
</html>
