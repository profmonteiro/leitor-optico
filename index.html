<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Leitor Óptico</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #f5f5f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    h1 { font-size: 1.15rem; margin-bottom: 10px; text-align: center; color: #fff; }
    #status {
      width: 100%; max-width: 520px; padding: 10px 14px; border-radius: 10px;
      background: #1e1e1e; border: 1px solid #333; text-align: center;
      font-size: 0.92rem; font-weight: 600; color: #ffd54f; margin-bottom: 10px;
    }
    #status.ok { border-color: #00e676; color: #00e676; background: #0d2618; }
    .viewport {
      position: relative; width: 100%; max-width: 520px; border-radius: 14px;
      overflow: hidden; background: #000; border: 2px solid #2c2c2c;
    }
    video { display: none; }
    canvas { width: 100%; height: auto; display: block; }
    #resultado {
      width: 100%; max-width: 520px; margin-top: 12px; padding: 14px;
      border-radius: 12px; background: #1c1c1c; border: 1px solid #333; display: none;
    }
    .nota-box { font-size: 1.3rem; font-weight: 800; color: #00e676; margin-bottom: 8px; }
    .detalhes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.9rem; }
    .item-q { background: #262626; padding: 8px 10px; border-radius: 8px; }
    .correta { border-left: 4px solid #00e676; }
    .errada { border-left: 4px solid #ff5252; }
    button {
      margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #2979ff; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="titulo">Leitor Óptico</h1>
  <div id="status">Iniciando câmera...</div>

  <div class="viewport">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="resultado">
    <div class="nota-box" id="notaTexto"></div>
    <div class="detalhes" id="detalhesQuestoes"></div>
    <button onclick="reiniciarLeitura()">Ler Próximo Cartão</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const tituloEl = document.getElementById('titulo');
    const resultadoEl = document.getElementById('resultado');

    // Geometria exata extraida do seu codigo TikZ/LaTeX
    // Centros das 4 ancoras pretas: SE(-0.15, 7.95), SD(12.65, 7.95), IE(-0.15, -0.35), ID(12.65, -0.35)
    const CARD = {
      x0: -0.15, y0: 7.95,
      W: 12.80,  H: 8.30,
      // QR Code: topo-direito em (12.15, 7.55), tamanho 1.55 x 1.55
      qr: { x: 10.60, y: 7.55, size: 1.55 },
      // Coordenadas das questoes e alternativas
      questoesY: [4.9, 3.7, 2.5, 1.3],
      opcoesX:   [4.8, 6.3, 7.8, 9.3, 10.8],
      letras:    ['A', 'B', 'C', 'D', 'E'],
      raioBolha: 0.26
    };

    let travado = false;
    let gabaritoAtual = null;
    let provaIdAtual = '';
    async function iniciarCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        statusEl.textContent = 'Aponte para o cartão (pode ser na vertical ou horizontal)';
        requestAnimationFrame(processarFrame);
      } catch (e) {
        statusEl.textContent = 'Erro ao acessar a câmera. Verifique as permissões.';
      }
    }

    function parseQR(texto) {
      const mId = texto.match(/ID-PROVA:([^;]+)/i);
      const mGab = texto.match(/GAB:([^;]+)/i);
      if (!mGab) return null;
      const gab = {};
      mGab[1].split('-').forEach(par => {
        const m = par.match(/Q(\d+)([A-E])/i);
        if (m) gab[parseInt(m[1], 10)] = m[2].toUpperCase();
      });
      return { id: mId ? mId[1] : 'PROVA', gab };
    }

    // Converte coordenada TikZ (x, y) para pixel usando os vetores do QR Code
    function tikzParaPixel(tx, ty, qrLoc) {
      const uQr0 = (CARD.qr.x - CARD.x0) / CARD.W;
      const vQr0 = (CARD.y0 - CARD.qr.y) / CARD.H;
      const duQr = CARD.qr.size / CARD.W;
      const dvQr = CARD.qr.size / CARD.H;

      const u = (tx - CARD.x0) / CARD.W;
      const v = (CARD.y0 - ty) / CARD.H;

      const ru = (u - uQr0) / duQr;
      const rv = (v - vQr0) / dvQr;

      const p0 = qrLoc.topLeftCorner;
      const vx = { x: qrLoc.topRightCorner.x - p0.x, y: qrLoc.topRightCorner.y - p0.y };
      const vy = { x: qrLoc.bottomLeftCorner.x - p0.x, y: qrLoc.bottomLeftCorner.y - p0.y };

      return {
        x: p0.x + ru * vx.x + rv * vy.x,
        y: p0.y + ru * vx.y + rv * vy.y
      };
    }

    // Refina o centro exato de cada quadrado preto proximo ao ponto previsto
    function refinarAncora(imgData, pred, raioPx) {
      const { data, width, height } = imgData;
      const xMin = Math.max(0, Math.floor(pred.x - raioPx));
      const xMax = Math.min(width - 1, Math.ceil(pred.x + raioPx));
      const yMin = Math.max(0, Math.floor(pred.y - raioPx));
      const yMax = Math.min(height - 1, Math.ceil(pred.y + raioPx));

      let sumX = 0, sumY = 0, count = 0;
      for (let y = yMin; y <= yMax; y++) {
        for (let x = xMin; x <= xMax; x++) {
          const i = (y * width + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (lum < 95) { sumX += x; sumY += y; count++; }
        }
      }
      if (count < 15) return null;
      return { x: sumX / count, y: sumY / count };
    }

    // Interpolacao bilinear entre os 4 cantos reais detectados (SE, SD, IE, ID)
    function mapearUV(u, v, c) {
      const topX = c.SE.x + u * (c.SD.x - c.SE.x);
      const topY = c.SE.y + u * (c.SD.y - c.SE.y);
      const botX = c.IE.x + u * (c.ID.x - c.IE.x);
      const botY = c.IE.y + u * (c.ID.y - c.IE.y);
      return {
        x: topX + v * (botX - topX),
        y: topY + v * (botY - topY)
      };
    }

    function medirEscuridao(imgData, pt, raioPx) {
      const { data, width, height } = imgData;
      let total = 0, escuros = 0;
      const r2 = raioPx * raioPx;
      for (let dy = -raioPx; dy <= raioPx; dy++) {
        for (let dx = -raioPx; dx <= raioPx; dx++) {
          if (dx * dx + dy * dy > r2) continue;
          const x = Math.round(pt.x + dx), y = Math.round(pt.y + dy);
          if (x < 0 || x >= width || y < 0 || y >= height) continue;
          const i = (y * width + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          total++;
          if (lum < 125) escuros++;
        }
      }
      return total > 0 ? escuros / total : 0;
    }

    function processarFrame() {
      if (!travado && video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const qr = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });

        if (qr) {
          const info = parseQR(qr.data);
          if (info) {
            provaIdAtual = info.id;
            gabaritoAtual = info.gab;
            tituloEl.textContent = `Leitor Óptico — ${provaIdAtual}`;

            // Desenha contorno do QR
            ctx.strokeStyle = '#00e676';
            ctx.lineWidth = 3;
            const loc = qr.location;
            ctx.beginPath();
            ctx.moveTo(loc.topLeftCorner.x, loc.topLeftCorner.y);
            ctx.lineTo(loc.topRightCorner.x, loc.topRightCorner.y);
            ctx.lineTo(loc.bottomRightCorner.x, loc.bottomRightCorner.y);
            ctx.lineTo(loc.bottomLeftCorner.x, loc.bottomLeftCorner.y);
            ctx.closePath();
            ctx.stroke();

            // Estima tamanho do QR em pixels para definir janela de busca das ancoras
            const qrPx = Math.hypot(loc.topRightCorner.x - loc.topLeftCorner.x, loc.topRightCorner.y - loc.topLeftCorner.y);
            const raioBusca = qrPx * 0.55;

            const cantos = {
              SE: refinarAncora(imgData, tikzParaPixel(-0.15,  7.95, loc), raioBusca),
              SD: refinarAncora(imgData, tikzParaPixel(12.65,  7.95, loc), raioBusca),
              IE: refinarAncora(imgData, tikzParaPixel(-0.15, -0.35, loc), raioBusca),
              ID: refinarAncora(imgData, tikzParaPixel(12.65, -0.35, loc), raioBusca)
            };

            const achados = Object.values(cantos).filter(Boolean).length;
            if (achados < 4) {
              statusEl.className = '';
              statusEl.textContent = `QR lido! Detectados ${achados}/4 cantos. Afaste um pouco a câmera.`;
            } else {
              // Desenha poligono dos 4 cantos
              ctx.strokeStyle = '#00e676';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(cantos.SE.x, cantos.SE.y);
              ctx.lineTo(cantos.SD.x, cantos.SD.y);
              ctx.lineTo(cantos.ID.x, cantos.ID.y);
              ctx.lineTo(cantos.IE.x, cantos.IE.y);
              ctx.closePath();
              ctx.stroke();

              // Leitura das 4 questoes
              const larguraPx = Math.hypot(cantos.SD.x - cantos.SE.x, cantos.SD.y - cantos.SE.y);
              const raioBolhaPx = Math.max(5, Math.round((CARD.raioBolha / CARD.W) * larguraPx * 0.85));
              const respostas = [];

              CARD.questoesY.forEach((qy, idxQ) => {
                const v = (CARD.y0 - qy) / CARD.H;
                let melhorLetra = '-';
                let maiorScore = 0;

                CARD.opcoesX.forEach((ox, idxO) => {
                  const u = (ox - CARD.x0) / CARD.W;
                  const pt = mapearUV(u, v, cantos);
                  const score = medirEscuridao(imgData, pt, raioBolhaPx);

                  ctx.beginPath();
                  ctx.arc(pt.x, pt.y, raioBolhaPx, 0, Math.PI * 2);
                  ctx.strokeStyle = score > 0.42 ? '#00e676' : '#2979ff';
                  ctx.lineWidth = 2;
                  ctx.stroke();

                  if (score > 0.42 && score > maiorScore) {
                    maiorScore = score;
                    melhorLetra = CARD.letras[idxO];
                  }
                });
                respostas.push({ q: idxQ + 1, marcada: melhorLetra, gabarito: gabaritoAtual[idxQ + 1] });
              });

              exibirResultado(respostas);
            }
          }
        }
      }
      requestAnimationFrame(processarFrame);
    }

    function exibirResultado(respostas) {
      travado = true;
      statusEl.className = 'ok';
      statusEl.textContent = 'Cartão lido com sucesso!';
      let acertos = 0;
      const html = respostas.map(r => {
        const ok = r.marcada === r.gabarito;
        if (ok) acertos++;
        return `<div class="item-q ${ok ? 'correta' : 'errada'}">
          <strong>Q0${r.q}:</strong> Marcada <b>${r.marcada}</b> (Gab: ${r.gabarito})
        </div>`;
      }).join('');
      document.getElementById('notaTexto').textContent = `Acertos: ${acertos} / ${respostas.length}`;
      document.getElementById('detalhesQuestoes').innerHTML = html;
      resultadoEl.style.display = 'block';
    }

    function reiniciarLeitura() {
      travado = false;
      resultadoEl.style.display = 'none';
      statusEl.className = '';
      statusEl.textContent = 'Aponte para o próximo cartão...';
    }

    iniciarCamera();
  </script>
</body>
</html>
