<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Leitor Óptico - Pontuação</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #121212;
      color: #f5f5f5;
      margin: 0;
      padding: 12px;
    }
    .container { max-width: 650px; margin: 0 auto; }
    h3 { margin: 6px 0 10px; }
    #status {
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      background: #1e1e1e;
      color: #ffd54f;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.4;
    }
    #status.ok { color: #00e676; border: 2px solid #00e676; font-size: 19px; }
    #status.erro { color: #ff5252; }
    #video { display: none; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 2px solid #333;
      background: #000;
    }
    .controles {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    button {
      background: #2979ff;
      color: white;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button.secundario { background: #424242; }
    table {
      width: 100%;
      margin-top: 12px;
      border-collapse: collapse;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #333;
      padding: 9px 5px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    th { background: #262626; color: #bbb; }
    .preview-box { margin-top: 12px; }
    .preview-box span {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    #canvasDebug { max-width: 340px; margin: 0 auto; }
  </style>
</head>
<body>
<div class="container">
  <h3>Leitor Óptico (v2 - Anel + Nota)</h3>
  <div id="status">Carregando leitor...</div>

  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvasOutput"></canvas>

  <div class="controles">
    <button onclick="permitirReleitura()">Ler Próxima Prova</button>
    <button class="secundario" onclick="baixarCSV()">Baixar CSV</button>
    <button class="secundario" onclick="reiniciarCamera()">Reiniciar Câmera</button>
  </div>

  <table id="tabelaResultados">
    <thead>
      <tr>
        <th>ID Prova</th>
        <th>Gabarito</th>
        <th>Respostas Lidas</th>
        <th>Acertos</th>
        <th>Nota (Max 3,0)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="preview-box">
    <span>Diagnóstico (verifique se SE/SD/ID/IE e os anéis batem):</span>
    <canvas id="canvasDebug"></canvas>
  </div>
</div>

<script>
"use strict";

// Regra de pontuação ponderada e coordenadas exatas do TikZ
const COORDENADAS_QUESTOES = [
  {
    numero: "Q5",
    peso: 2.0,
    y: 0.5242,
    opcoes: { A: 0.3242, B: 0.4414, C: 0.5586, D: 0.6758, E: 0.7930 }
  },
  {
    numero: "Q6",
    peso: 1.0,
    y: 0.6855,
    opcoes: { A: 0.3242, B: 0.4414, C: 0.5586, D: 0.6758, E: 0.7930 }
  }
];

const PONTUACAO_MAXIMA = COORDENADAS_QUESTOES.reduce((soma, q) => soma + q.peso, 0);
const GABARITO_PADRAO = { Q5: "C", Q6: "A" };

let resultados = [];
let ultimoQRBloqueado = "";
let streamCamera = null;
let cameraIniciada = false;

const video = document.getElementById("video");
const canvas = document.getElementById("canvasOutput");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const debugCanvas = document.getElementById("canvasDebug");
const debugCtx = debugCanvas.getContext("2d");

function status(mensagem, tipo = "") {
  const el = document.getElementById("status");
  el.textContent = mensagem;
  el.className = tipo;
}

function carregarBibliotecaQR() {
  const script = document.createElement("script");
  script.src = "https://jsdelivr.net" + "/npm/jsqr@1.4.0/dist/jsQR.min.js";
  script.onload = () => iniciarCamera();
  script.onerror = () => status("Erro de conexão ao carregar leitor QR.", "erro");
  document.head.appendChild(script);
}

async function iniciarCamera() {
  if (cameraIniciada) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    streamCamera = stream;
    video.srcObject = stream;
    await video.play();
    cameraIniciada = true;
    status("Aponte para o cartão (4 cantos + QR Code)");
    requestAnimationFrame(processarFrame);
  } catch (err) {
    status("Erro ao abrir câmera: " + err.message, "erro");
  }
}

function reiniciarCamera() {
  if (streamCamera) streamCamera.getTracks().forEach(t => t.stop());
  cameraIniciada = false;
  iniciarCamera();
}

function permitirReleitura() {
  ultimoQRBloqueado = "";
  status("Pronto! Aponte para a próxima prova.");
}

function extrairDadosQR(textoQR) {
  let idProva = textoQR;
  let gabarito = { ...GABARITO_PADRAO };
  textoQR.split(";").forEach(p => {
    if (p.startsWith("ID-PROVA:")) idProva = p.replace("ID-PROVA:", "").trim();
    if (p.startsWith("GAB:")) {
      p.replace("GAB:", "").split("-").forEach(item => {
        const m = item.match(/^(Q\d+)([A-E])$/i);
        if (m) gabarito[m[1].toUpperCase()] = m[2].toUpperCase();
      });
    }
  });
  return { idProva, gabarito };
}
function processarFrame() {
  if (video.readyState === video.HAVE_ENOUGH_DATA && typeof window.jsQR === "function") {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qrCode = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

    if (qrCode) {
      ctx.strokeStyle = "#00b0ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(qrCode.location.topLeftCorner.x, qrCode.location.topLeftCorner.y);
      ctx.lineTo(qrCode.location.topRightCorner.x, qrCode.location.topRightCorner.y);
      ctx.lineTo(qrCode.location.bottomRightCorner.x, qrCode.location.bottomRightCorner.y);
      ctx.lineTo(qrCode.location.bottomLeftCorner.x, qrCode.location.bottomLeftCorner.y);
      ctx.closePath();
      ctx.stroke();

      if (qrCode.data !== ultimoQRBloqueado) {
        const leitura = detectarELerCartao(imageData, qrCode);
        if (leitura) {
          ultimoQRBloqueado = qrCode.data;
          registrarResultado(leitura);
          if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
          status(
            `NOTA: ${leitura.notaFormatada} / ${PONTUACAO_MAXIMA.toFixed(1).replace(".", ",")} pts | Acertos: ${leitura.acertos}/${COORDENADAS_QUESTOES.length} (${leitura.respostasTexto})`,
            "ok"
          );
        }
      }
    }
  }
  requestAnimationFrame(processarFrame);
}

function detectarELerCartao(imageData, qrCode) {
  const W = imageData.width;
  const H = imageData.height;
  const data = imageData.data;

  const gray = new Uint8Array(W * H);
  let soma = 0;
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    const lum = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
    gray[j] = lum;
    soma += lum;
  }
  const limiar = (soma / (W * H)) * 0.65;

  const visitado = new Uint8Array(W * H);
  const qrCx = (qrCode.location.topLeftCorner.x + qrCode.location.bottomRightCorner.x) / 2;
  const qrCy = (qrCode.location.topLeftCorner.y + qrCode.location.bottomRightCorner.y) / 2;
  const qrTam = Math.hypot(
    qrCode.location.topRightCorner.x - qrCode.location.topLeftCorner.x,
    qrCode.location.topRightCorner.y - qrCode.location.topLeftCorner.y
  );

  const minPixels = (W * H) * 0.00018;
  const maxPixels = (W * H) * 0.022;
  let candidatos = [];
  const stackX = new Int32Array(maxPixels + 200);
  const stackY = new Int32Array(maxPixels + 200);

  for (let y = 6; y < H - 6; y++) {
    for (let x = 6; x < W - 6; x++) {
      const idx = y * W + x;
      if (gray[idx] < limiar && !visitado[idx]) {
        let top = 0;
        stackX[top] = x;
        stackY[top] = y;
        visitado[idx] = 1;

        let count = 0, minX = x, maxX = x, minY = y, maxY = y;
        while (top >= 0) {
          const cx = stackX[top];
          const cy = stackY[top];
          top--;
          count++;

          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;
          if (count > maxPixels) break;

          const viz = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
          for (let k = 0; k < 4; k++) {
            const nx = viz[k][0], ny = viz[k][1];
            if (nx > 0 && nx < W && ny > 0 && ny < H) {
              const nIdx = ny * W + nx;
              if (!visitado[nIdx] && gray[nIdx] < limiar) {
                visitado[nIdx] = 1;
                top++;
                stackX[top] = nx;
                stackY[top] = ny;
              }
            }
          }
        }

        if (count >= minPixels && count <= maxPixels) {
          const bw = maxX - minX + 1;
          const bh = maxY - minY + 1;
          const ratio = bw / bh;
          const centX = (minX + maxX) / 2;
          const centY = (minY + maxY) / 2;

          if (Math.hypot(centX - qrCx, centY - qrCy) > qrTam * 0.70 && ratio >= 0.65 && ratio <= 1.50) {
            candidatos.push({ x: centX, y: centY, area: count, rect: { x: minX, y: minY, w: bw, h: bh } });
          }
        }
      }
    }
  }

  if (candidatos.length > 4) {
    candidatos.sort((a, b) => b.area - a.area);
    candidatos = candidatos.slice(0, 4);
  }
  if (candidatos.length !== 4) return null;

  ctx.strokeStyle = "#00e676";
  ctx.lineWidth = 5;
  candidatos.forEach(c => ctx.strokeRect(c.rect.x, c.rect.y, c.rect.w, c.rect.h));

  // Ordena os 4 cantos em sentido horário na tela
  const mX = candidatos.reduce((s, c) => s + c.x, 0) / 4;
  const mY = candidatos.reduce((s, c) => s + c.y, 0) / 4;
  candidatos.sort((a, b) => Math.atan2(a.y - mY, a.x - mX) - Math.atan2(b.y - mY, b.x - mX));

  let idxQR = 0, menorD = Infinity;
  candidatos.forEach((c, idx) => {
    const d = Math.hypot(c.x - qrCx, c.y - qrCy);
    if (d < menorD) { menorD = d; idxQR = idx; }
  });

  const supDir = candidatos[idxQR];
  const infDir = candidatos[(idxQR + 1) % 4];
  const infEsq = candidatos[(idxQR + 2) % 4];
  const supEsq = candidatos[(idxQR + 3) % 4];

  function mapearPonto(u, v) {
    const topX = supEsq.x + (supDir.x - supEsq.x) * u;
    const topY = supEsq.y + (supDir.y - supEsq.y) * u;
    const botX = infEsq.x + (infDir.x - infEsq.x) * u;
    const botY = infEsq.y + (infDir.y - infEsq.y) * u;
    return {
      x: Math.round(topX + (botX - topX) * v),
      y: Math.round(topY + (botY - topY) * v)
    };
  }

  debugCanvas.width = W;
  debugCanvas.height = H;
  debugCtx.putImageData(imageData, 0, 0);

  debugCtx.fillStyle = "#00e676";
  debugCtx.font = "bold 22px sans-serif";
  debugCtx.fillText("SE", supEsq.x, supEsq.y);
  debugCtx.fillText("SD", supDir.x, supDir.y);
  debugCtx.fillText("ID", infDir.x, infDir.y);
  debugCtx.fillText("IE", infEsq.x, infEsq.y);

  // Raio externo proporcional à bolinha de 0.25cm (0.25 / 12.80 = 0.0195 da largura do cartão)
  const larguraCartaoPx = Math.hypot(supDir.x - supEsq.x, supDir.y - supEsq.y);
  const raioExterno = Math.max(8, Math.round(larguraCartaoPx * 0.017));
  const raioInterno = Math.max(3, Math.round(raioExterno * 0.42)); // Ignora o miolo da letra impressa!

  const { idProva, gabarito } = extrairDadosQR(qrCode.data);
  let respostasLidas = [];
  let acertos = 0;
  let notaTotal = 0;

  COORDENADAS_QUESTOES.forEach(q => {
    let medicoes = [];

    for (const [letra, propX] of Object.entries(q.opcoes)) {
      const pt = mapearPonto(propX, q.y);
      let somaLuminancia = 0;
      let totalPixelsAnel = 0;

      // Amostragem em ANEL CIRCULAR: evita a letra no centro e a borda preta externa
      for (let dy = -raioExterno; dy <= raioExterno; dy++) {
        for (let dx = -raioExterno; dx <= raioExterno; dx++) {
          const dist2 = dx * dx + dy * dy;
          if (dist2 >= raioInterno * raioInterno && dist2 <= raioExterno * raioExterno) {
            const px = pt.x + dx;
            const py = pt.y + dy;
            if (px >= 0 && px < W && py >= 0 && py < H) {
              somaLuminancia += gray[py * W + px];
              totalPixelsAnel++;
            }
          }
        }
      }

      const escuridaoAnel = 255 - (somaLuminancia / Math.max(1, totalPixelsAnel));
      medicoes.push({ letra, escuridao: escuridaoAnel, pt });

      // Desenha os dois círculos do anel em vermelho no diagnóstico
      debugCtx.strokeStyle = "red";
      debugCtx.lineWidth = 2;
      debugCtx.beginPath();
      debugCtx.arc(pt.x, pt.y, raioExterno, 0, Math.PI * 2);
      debugCtx.stroke();
      debugCtx.beginPath();
      debugCtx.arc(pt.x, pt.y, raioInterno, 0, Math.PI * 2);
      debugCtx.stroke();
    }

    // Compara as 5 alternativas entre si
    medicoes.sort((a, b) => b.escuridao - a.escuridao);
    const maisEscura = medicoes[0];
    const segunda = medicoes[1];
    const mediaVazias = (medicoes[1].escuridao + medicoes[2].escuridao + medicoes[3].escuridao + medicoes[4].escuridao) / 4;

    let marcada = "-";
    if (maisEscura.escuridao - mediaVazias > 22 && (maisEscura.escuridao - segunda.escuridao) > 14) {
      marcada = maisEscura.letra;
      debugCtx.strokeStyle = "#00e676";
      debugCtx.lineWidth = 5;
      debugCtx.beginPath();
      debugCtx.arc(maisEscura.pt.x, maisEscura.pt.y, raioExterno + 4, 0, Math.PI * 2);
      debugCtx.stroke();
    } else if (maisEscura.escuridao - mediaVazias > 22 && (segunda.escuridao - mediaVazias) > 22) {
      marcada = "DUPLA";
    }

    const acertou = marcada === gabarito[q.numero];
    if (acertou) {
      acertos++;
      notaTotal += q.peso;
    }

    respostasLidas.push(`${q.numero}:${marcada}${acertou ? "✓" : "✗"}`);
  });

  return {
    idProva,
    gabaritoTexto: Object.entries(gabarito).map(([k, v]) => `${k}:${v}`).join(" "),
    respostasTexto: respostasLidas.join(" | "),
    acertos,
    notaFormatada: notaTotal.toFixed(1).replace(".", ",")
  };
}

function registrarResultado(item) {
  resultados.push(item);
  const tbody = document.querySelector("#tabelaResultados tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><strong>${item.idProva}</strong></td>
    <td>${item.gabaritoTexto}</td>
    <td>${item.respostasTexto}</td>
    <td>${item.acertos}/${COORDENADAS_QUESTOES.length}</td>
    <td style="color:#00e676;font-size:14px;"><strong>${item.notaFormatada}</strong></td>
  `;
  tbody.prepend(tr);
}

function baixarCSV() {
  let csv = "ID_Prova;Gabarito;Respostas_Lidas;Acertos;Nota_Max_3\n";
  resultados.forEach(r => {
    csv += `${r.idProva};${r.gabaritoTexto};${r.respostasTexto};${r.acertos};${r.notaFormatada}\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "notas_provas.csv";
  link.click();
}

carregarBibliotecaQR();
</script>
</body>
</html>
